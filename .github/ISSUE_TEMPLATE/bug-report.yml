name: Bug report
description: Report a problem with the UNCHARTABLE desktop app.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what went wrong and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - Linux (AppImage)
        - Linux (Debian package)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UNCHARTABLE version
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or details that can help reproduce the problem. Do not share private files or folder names.
