name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm run test
      - name: Frontend build
        run: npm run build
      - name: Rust format
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native Linux app
        if: runner.os == 'Linux'
        run: npm run tauri -- build --debug --no-bundle
