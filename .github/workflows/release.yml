name: release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm run test
      - name: Test native installer
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build portable executable
        run: npm run build:portable
      - name: Package portable release
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version "${{ github.ref_name }}".TrimStart("v")
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @"
          ## What's new

          - Drag and drop a chart ZIP anywhere in the app to validate and import it.
          - Browse chart packs and install their charts through a guided selection.
          - Search the installed library by title, artist, charter, or folder.
          - Recognize compatible charts that were installed manually and link them to UNCHARTABLE.
          - Enable automatic updates for every recognized chart with one action.
          - Keep downloads in a persistent queue with progress, retry, and cancellation controls.
          - Restore deleted charts from trash and empty the trash when it is no longer needed.
          - Roll back chart updates using automatically retained backups.
          - Repair incomplete temporary installs and review compact library diagnostics.
          - Create and export local chart packs.
          - Keep UNCHARTABLE available from the system tray with low background activity.

          ## Import safety

          Imported archives are validated before extraction. UNCHARTABLE rejects unsupported formats, unsafe paths, executable payloads, incomplete charts, and archives larger than 250 MB.

          ## Verification

          This release includes a SHA-256 checksum for the portable executable.
          "@ | Set-Content -Encoding utf8 release-notes.md

          gh release create "${{ github.ref_name }}" `
            --title "UNCHARTABLE ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            output/release/*.exe `
            output/release/*.sha256
